# model_moment: the name of the model-side moment (M3 spec) that the data moment is the counterpart of ("none" where the model has no counterpart yet).
# convention: 'obs/sqrt(R)' = observed slope / sqrt(R_comp_pop), the project's latent slope (the pipeline of the 0.2127 wage_slope target); it is the `value` of every slope in this file.
