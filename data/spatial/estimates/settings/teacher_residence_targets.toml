# value / se / n_cz: pupil-weighted mean over CZs of the within-CZ gap, whole-CZ bootstrap SE (B = 1999, seed 20260929; the draws
# of district_settings.py, so the correlations are valid). Residents are counted once (unified + elementary ACS records).

