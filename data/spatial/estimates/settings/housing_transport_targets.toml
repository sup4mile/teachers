[housing_demand.model_definitions]
note = "Preferences (1 - aH) log c + aH log(H - hmin) over non-housing consumption c and housing H; Y' is the household's outlay on c and housing (income after taxes, education goods, moving, residence-charge and other fixed goods costs), C = Y' - R hmin the supernumerary expenditure. Then H = hmin + aH C / R, R H = R hmin + aH C, c = (1 - aH) C and Y' = C + R hmin (DESIGN_v2: the line of DESIGN.md M1b 'Y' = (1 + aH) C + R hmin' double counts aH C; it holds only for preferences log c + aH log(H - hmin), whose marginal housing share is aH / (1 + aH)). aH is the MARGINAL budget share of housing, the quantity estimated by the Stone-Geary fit s(y) = aH + (1 - aH) h / y; hmin is h over mean expenditure per equivalent adult (units of Cbar at R = 1). `housing_share` must be computed as a RATIO OF AGGREGATES, sum_i R H_i / sum_i Y'_i over the adults (and `housing_share_by_income` as the same ratio within terciles of pre-tax income): the CE targets are aggregate shelter + utilities over aggregate expenditures. A mean over adults of R H_i / Y'_i (M1B_SPEC) is a different moment: because the share falls with expenditure it is larger (the consumer-unit-weighted mean of the five CE quintile shares, 0.276, is a lower bound for a household-level mean of ratios, against the aggregate 0.258). Units: dollar amounts per household (r_car, the housing-cost gap) are divided by the mean expenditure per consumer unit, $61,224, as in housing_costs.md, which is unit-free if per-household costs and consumption scale together with household size; hmin is already a ratio of two amounts in the same unit (h per equivalent adult over mean expenditure per equivalent adult), so the dollar h per equivalent adult must not be divided by $61,224 (a household of mean size has h = hmin x $61,224)."

